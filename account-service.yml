server:
  port: 8081

msg: "Welcome to FinSecure Account Service"
spring:
  boot:
    admin:
      client:
        url: http://localhost:1111       # ⭐ Admin Server ka address
  application:
    name: account-service

# Common Eureka config (ab har service mein alag se nahi likhna!)
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: '*'           # ⭐ Sab endpoints expose karo (health, info, beans, loggers...)
  endpoint:
    health:
      show-details: always     # Health ka full detail dikhao
