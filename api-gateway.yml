server:
  port: 9000

# ⭐ Hardcoded token ab config se aayega!
gateway:
  secret-token: finsecure@123

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

spring:
  cloud:
    gateway:
      routes:
        - id: account-route
          uri: lb://account-service
          predicates:
            - Path=/accounts/**
        - id: transaction-route
          uri: lb://transaction-service
          predicates:
            - Path=/transactions/**

management:
  endpoints:
    web:
      exposure
        include: health,info,gateway,refresh
